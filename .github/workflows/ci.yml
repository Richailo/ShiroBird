name: Test and build
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q shirobird
      - run: bash -n scripts/install.sh scripts/install-collector.sh scripts/install-integrated.sh
      - run: node --check integration/bridge.js && node --check web/app.js
      - run: docker build -t shirobird:test .
      - name: Dashboard bridge integration smoke test
        run: |
          docker network create netbird_netbird
          docker run -d --name netbird-dashboard --network netbird_netbird nginx:stable-alpine
          sudo bash scripts/install.sh
          test -L compose.override.yaml
          sudo grep -q '^SHIROBIRD_NETBIRD_NETWORK=netbird_netbird' .env
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8082/shirobird/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8082/ | grep -q 'shirobird-integration/bridge.js'
          curl -fsS http://127.0.0.1:8082/shirobird-integration/bridge.js | grep -q 'left-navigation-item'
          curl -fsS http://127.0.0.1:8082/shirobird-integration/bridge.js | grep -q 'Traffic Flow'
          curl -fsS http://127.0.0.1:8082/shirobird-integration/bridge.js | grep -q 'SIEM Integration'
          curl -fsS 'http://127.0.0.1:8082/shirobird/?embedded=1&view=siem-integration' | grep -q 'id="siem-view"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/shirobird/api/stats)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/shirobird/api/siem/status)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/shirobird/api/traffic/analytics)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/shirobird/api/traffic/sensors)" = "401"
          curl -fsS 'http://127.0.0.1:8082/shirobird/?embedded=1&view=traffic-flow' | grep -q 'id="flow-groups"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8082/shirobird/api/siem/syslog)" = "401"
          curl -fsS 'http://127.0.0.1:8082/shirobird/?embedded=1&view=siem-integration' | grep -q 'id="syslog-form"'
          curl -fsS -D /tmp/shirobird-headers -o /dev/null http://127.0.0.1:8082/shirobird/
          grep -qi '^X-Frame-Options: SAMEORIGIN' /tmp/shirobird-headers
          test "$(curl -fsS http://127.0.0.1:8082/ | grep -o 'shirobird-integration/bridge.js' | wc -l)" -eq 1
      - name: Bridge logs if failed
        if: failure()
        run: docker compose -f compose.yaml -f compose.bridge.yaml logs --no-color || true
      - name: Clean up
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.bridge.yaml down || true
          docker rm -f netbird-dashboard || true
          docker network rm netbird_netbird || true

  windows-wfp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows WFP parser and PowerShell collector syntax
        shell: powershell
        run: .\\windows\\test.ps1

  native-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent native receiver
        run: docker build -t shirobird-native-flow:test extensions/native-flow
      - name: Protocol, persistence, authentication and API tests
        run: docker run --rm --network none shirobird-native-flow:test python -m unittest -v

  management-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Fetch and verify pinned public NetBird source
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/netbirdio/netbird/tar.gz/refs/tags/v0.81.3 -o "$RUNNER_TEMP/netbird.tar.gz"
          echo "a06c0c3ffc84a78a5ee019641988cfe0ea38ea980609535f66dd4ae82929daed  $RUNNER_TEMP/netbird.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/netbird.tar.gz" -C "$RUNNER_TEMP"
      - name: Validate guarded preparation and apply isolated hooks
        run: |
          SHIROBIRD_NETBIRD_ARCHIVE="$RUNNER_TEMP/netbird.tar.gz" python -m unittest discover -s extensions/management-adapter -v
          python extensions/management-adapter/prepare.py --source-dir "$RUNNER_TEMP/netbird-0.81.3"
          mkdir "$RUNNER_TEMP/netbird-0.81.3/flow/shirobirdcompat"
          cp extensions/management-adapter/native_client_probe.go "$RUNNER_TEMP/netbird-0.81.3/flow/shirobirdcompat/main.go"
      - name: Race tests and real management package compilation
        env:
          GOMAXPROCS: '2'
        run: |
          cd "$RUNNER_TEMP/netbird-0.81.3"
          gofmt -w management/server/shirobirdflow/*.go management/internals/shared/grpc/conversion.go management/internals/shared/grpc/components_envelope_response.go management/internals/shared/grpc/token_mgr.go flow/shirobirdcompat/main.go
          SHIROBIRD_TEST_TOKEN_OUTPUT="$PWD/adapter-test-token.json" go test -p 1 -race -v ./management/server/shirobirdflow
          go test -p 1 -run '^$' ./management/internals/shared/grpc
          CGO_ENABLED=0 go build -p 1 -o native-client-probe ./flow/shirobirdcompat
          CGO_ENABLED=1 go build -p 1 -o netbird-server ./combined
      - name: Official flow client with Go-issued credential against Python receiver
        run: |
          docker build -t shirobird-native-flow:adapter-test extensions/native-flow
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 256m \
            -e PYTHONPATH=/app \
            -v "$PWD/extensions/management-adapter:/checks:ro" \
            -v "$RUNNER_TEMP/netbird-0.81.3/native-client-probe:/fixtures/native-client-probe:ro" \
            -v "$RUNNER_TEMP/netbird-0.81.3/adapter-test-token.json:/fixtures/adapter-test-token.json:ro" \
            shirobird-native-flow:adapter-test \
            python /checks/verify_receiver.py /fixtures/native-client-probe /fixtures/adapter-test-token.json
