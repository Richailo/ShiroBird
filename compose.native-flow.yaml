# Optional overlay only; does not modify or replace any NetBird service.
# docker compose -f compose.yaml -f compose.override.yaml -f compose.native-flow.yaml up -d
services:
  shirobird:
    environment:
      SHIROBIRD_NATIVE_API_URL: http://native-flow:8085
      SHIROBIRD_NATIVE_API_TOKEN_FILE: /run/secrets/native_api_token
    secrets: [native_api_token]
  native-flow:
    build: ./extensions/native-flow
    image: ${SHIROBIRD_NATIVE_IMAGE:-shirobird-native-flow:local}
    container_name: shirobird-native-flow
    pull_policy: never
    restart: unless-stopped
    environment:
      SHIROBIRD_FLOW_SECRET_FILE: /run/secrets/native_flow_secret
      SHIROBIRD_NATIVE_API_TOKEN_FILE: /run/secrets/native_api_token
      SHIROBIRD_NATIVE_DATA: /data
    secrets: [native_flow_secret, native_api_token]
    ports:
      - "${SHIROBIRD_NATIVE_BIND:-127.0.0.1}:8084:8084"
      - "127.0.0.1:8085:8085"
    volumes: [native_flow_data:/data]
    read_only: true
    # SQLite GROUP BY/ORDER BY needs temporary space even with a read-only
    # container root. Keep scratch data ephemeral and memory-bounded.
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
secrets:
  native_flow_secret:
    file: ${SHIROBIRD_NATIVE_FLOW_SECRET_FILE:-./extensions/native-flow/flow-secret}
  native_api_token:
    file: ${SHIROBIRD_NATIVE_API_SECRET_FILE:-./extensions/native-flow/api-token}
volumes:
  native_flow_data:
