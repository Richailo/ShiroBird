server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Docker DNS is resolved per request, surviving official container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $netbird_dashboard "netbird-dashboard:80";
    set $shirobird_backend "shirobird:8666";
    location = /shirobird-integration/bridge.js {
        alias /usr/share/nginx/html/bridge.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /shirobird-integration/bridge.css {
        alias /usr/share/nginx/html/bridge.css;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /shirobird { return 308 /shirobird/; }
    location ^~ /shirobird/ {
        rewrite ^/shirobird/(.*)$ /$1 break;
        proxy_pass http://$shirobird_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1850s;
        proxy_connect_timeout 5s;
    }
    location / {
        proxy_pass http://$netbird_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/shirobird-integration/bridge.js"></script><link rel="stylesheet" href="/shirobird-integration/bridge.css"></head>';
        proxy_read_timeout 120s;
    }
}
