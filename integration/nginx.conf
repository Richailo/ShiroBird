server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /shirobird-integration/bridge.js {
        alias /usr/share/nginx/html/bridge.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /shirobird-integration/bridge.css {
        alias /usr/share/nginx/html/bridge.css;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /shirobird { return 308 /shirobird/; }
    location ^~ /shirobird/ {
        proxy_pass http://shirobird:8666/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1850s;
        proxy_connect_timeout 5s;
    }
    location / {
        proxy_pass http://netbird-dashboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/shirobird-integration/bridge.js"></script><link rel="stylesheet" href="/shirobird-integration/bridge.css"></head>';
        proxy_read_timeout 120s;
    }
}
