<g fill="#f68330"><circle cx="864" cy="135" r="5"/><circle cx="954" cy="109" r="4"/><circle cx="1077" cy="75" r="5"/></g>
<g fill="#e1e7f0" fill-opacity=".52"><circle cx="873" cy="188" r="4"/><circle cx="969" cy="177" r="5"/><circle cx="1095" cy="140" r="3"/></g>
<g transform="translate(69 77)">
