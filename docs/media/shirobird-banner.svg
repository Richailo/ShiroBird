 <radialGradient id="glow"><stop stop-color="#f78334" stop-opacity=".15"/><stop offset="1" stop-color="#f78334" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<rect width="1200" height="300" rx="20" fill="url(#grid)"/>
