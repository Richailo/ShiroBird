<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">ShiroBird — Traffic visibility for self-hosted NetBird</title>
<desc id="desc">Orange stylized bird with network trails and the ShiroBird wordmark on a dark background.</desc>
<defs>
