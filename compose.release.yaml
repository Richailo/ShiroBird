# Standalone release (image-only; NetBird overlay optional)
name: shirobird
services:
  shirobird:
    image: ${SHIROBIRD_RELEASE_IMAGE:-ghcr.io/richailo/shirobird:0.1.0-rc.1}
    restart: unless-stopped
    env_file: .env
    environment:
      SHIROBIRD_BIND: "0.0.0.0"
      SHIROBIRD_PORT: "8666"
      SHIROBIRD_DATA: "/data"
    ports: ["127.0.0.1:${SHIROBIRD_PORT:-8666}:8666"]
    volumes: ["./data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    init: true
    stop_grace_period: 30s
